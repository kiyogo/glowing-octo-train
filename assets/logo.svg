<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Icon Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0866ff"/>
      <stop offset="100%" stop-color="#004be0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0866ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00d2ff" flood-opacity="0.25"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="916" height="256" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Light Glow Behind Logo -->
  <circle cx="135" cy="130" r="100" fill="url(#glowGrad)"/>

  <!-- Decorative Tech Circuit / Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
    <line x1="280" y1="45" x2="880" y2="45" />
    <line x1="280" y1="215" x2="880" y2="215" />
    <circle cx="880" cy="45" r="3" fill="#38bdf8" />
    <circle cx="880" cy="215" r="3" fill="#6366f1" />
  </g>

  <!-- ================= LOGO ICON ================= -->
  <g transform="translate(60, 55)" filter="url(#shadowFilter)">
    <!-- Main Hexagon / Squircle Badge -->
    <rect x="0" y="0" width="150" height="150" rx="36" fill="url(#primaryGrad)" />
    
    <!-- Inner Shimmer Border -->
    <rect x="3" y="3" width="144" height="144" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Stylized Robotics & Network Core inside Icon -->
    <!-- Stylized "F" merged with Automation Nodes -->
    <path d="M 52 114 L 52 38 L 96 38 C 104 38 110 44 110 52 C 110 60 104 66 96 66 L 74 66 L 74 82 L 92 82 C 98 82 102 86 102 91 C 102 96 98 100 92 100 L 74 100 L 74 114 C 74 119 70 123 65 123 C 60 123 52 119 52 114 Z" 
          fill="#ffffff" />
    
    <!-- Lightning / Automation Bolt -->
    <path d="M 104 92 L 122 66 L 108 66 L 118 42 L 94 72 L 106 72 Z" 
          fill="#facc15" filter="url(#softGlow)"/>

    <!-- Small Tech Connection Dots -->
    <circle cx="40" cy="40" r="4" fill="#67e8f9"/>
    <circle cx="118" cy="118" r="4" fill="#67e8f9"/>
  </g>

  <!-- ================= TEXT SECTION ================= -->
  <!-- Top Pill Tag -->
  <g transform="translate(250, 48)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#22c55e"/>
    <text x="26" y="17" class="badge-text" fill="#93c5fd">NEXT-GEN AUTOMATION</text>
  </g>

  <!-- Main Title -->
  <text x="250" y="112" class="title-text">
    Facebook <tspan fill="url(#accentGrad)">Automation</tspan> Toolkit
  </text>

  <!-- Subtitle -->
  <text x="250" y="142" class="subtitle-text">
    High-Performance Account Registration Engine &amp; Multi-Threaded Messenger Outreach
  </text>

  <!-- ================= TECH STACK CHIPS ================= -->
  <g transform="translate(250, 172)">
    <!-- Chip 1: Playwright -->
    <g transform="translate(0, 0)">
      <rect width="115" height="32" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1"/>
      <text x="57" y="20" class="badge-text" text-anchor="middle" fill="#e2e8f0">🎭 Playwright</text>
    </g>

    <!-- Chip 2: Python 3.10+ -->
    <g transform="translate(125, 0)">
      <rect width="110" height="32" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1"/>
      <text x="55" y="20" class="badge-text" text-anchor="middle" fill="#e2e8f0">🐍 Python 3.10+</text>
    </g>

    <!-- Chip 3: Temp-Mail API -->
    <g transform="translate(245, 0)">
      <rect width="125" height="32" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1"/>
      <text x="62" y="20" class="badge-text" text-anchor="middle" fill="#e2e8f0">✉️ Auto TempMail</text>
    </g>

    <!-- Chip 4: Arkose Solver -->
    <g transform="translate(380, 0)">
      <rect width="125" height="32" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1"/>
      <text x="62" y="20" class="badge-text" text-anchor="middle" fill="#e2e8f0">🛡️ Arkose Solver</text>
    </g>

    <!-- Chip 5: Multi-threaded -->
    <g transform="translate(515, 0)">
      <rect width="115" height="32" rx="8" fill="url(#chipGrad)" stroke="#334155" stroke-width="1"/>
      <text x="57" y="20" class="badge-text" text-anchor="middle" fill="#e2e8f0">⚡ Multi-Thread</text>
    </g>
  </g>
</svg>
