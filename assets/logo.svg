<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="160" fill="none">
  <defs>
    <!-- Smooth Modern Blue Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0A4CC4"/>
    </linearGradient>

    <!-- Bolt Accent Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Clean Soft Drop Shadow -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0866FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="10" y="10" width="140" height="140" rx="38" fill="url(#logoBg)" filter="url(#cleanShadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="11.5" y="11.5" width="137" height="137" rx="36.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Minimalist Stylized 'F' + Automation Core -->
  <g fill="#FFFFFF">
    <!-- Main stem -->
    <rect x="52" y="44" width="18" height="72" rx="9"/>
    <!-- Top arm -->
    <path d="M 52 53 C 52 48 56 44 61 44 L 102 44 C 107 44 111 48 111 53 C 111 58 107 62 102 62 L 52 62 Z"/>
    <!-- Middle arm -->
    <rect x="52" y="72" width="46" height="18" rx="9"/>
  </g>

  <!-- Minimalist Lightning Accent representing Automation -->
  <path d="M 98 78 L 115 54 L 102 54 L 111 32 L 89 60 L 100 60 Z" fill="url(#boltGrad)"/>
</svg>
